server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: nasweo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/nasweodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

supabase:
  url: ${SUPABASE_URL:https://uhpbciegydqhkltnfnve.supabase.co}
  publishable-key: ${SUPABASE_ANON_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.nasweo: INFO
    org.springframework.security: WARN
